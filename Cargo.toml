[package]
name = "edict"
version = "0.1.0"
edition = "2021"
description = "A GPU-rendered DNA sequence editor"
license-file = "LICENSE"
publish = false

[dependencies]
gpui = "0.2.2"
gb-io = "0.9"
anyhow = "1"
# The bitmap type GPUI's RenderImage takes; already in the tree through gpui.
image = { version = "0.25", default-features = false }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only deflate: the native format never writes anything else, and we refuse other methods on read.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Terminal pane: libghostty-vt parses the VT stream and encodes keys; the build needs
# Zig 0.17 on PATH (the dev shell provides it). portable-pty spawns the shell.
ghostty-vt = { version = "=0.9.0", default-features = false }
portable-pty = "0.9"
async-channel = "2"
# BLAST searches at NCBI. Already in the tree (ghostty-vt-sys downloads with it).
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# Plugin manifests: the [tool.edict] table of a plugin script's PEP 723 block.
# Already in the tree (through gpui).
toml = { version = "0.8", default-features = false, features = ["parse"] }

[target.'cfg(unix)'.dependencies]
# localtime_r, for dating BLAST notes in the local time zone.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Desktop notifications when a task finishes in the background. Already in the tree
# (gpui -> ashpd); this only adds its blocking API.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# gpui 0.2.2 -> zed-async-tar -> xattr 0.2.3 uses libc::ENOATTR, which current libc no
# longer exports on Linux. ENOATTR is ENODATA there; this vendored copy changes only that.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
